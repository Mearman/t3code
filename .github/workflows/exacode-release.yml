name: ExaCode Release

# Fork-only nightly release for Mearman/t3code. release.yml stays identical to upstream and skips outside pingdotgg/t3code, so this workflow builds the desktop apps and server archives on GitHub-hosted runners and publishes them as prereleases here. It needs no secrets: macOS builds are signed ad hoc unless CSC_LINK and CSC_KEY_PASSWORD hold a certificate (see release-desktop.yml).

on:
  # Ships only commits whose CI passed on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every asset but publish nothing. Required off main."
        required: false
        default: false
        type: boolean

# Publishers are never cancelled; queue: max keeps every pending run so no CI success is dropped.
concurrency:
  group: exacode-release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  preflight:
    name: Preflight
    # A workflow_run from a pull request, even one whose fork branch is named main, never releases.
    if: >-
      github.repository != 'pingdotgg/t3code' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Reads the CI runs of a manually released commit.
      actions: read
      contents: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      publish: ${{ steps.source.outputs.publish }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
    steps:
      - id: source
        name: Resolve release source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_run" ]]; then
            echo "ref=$RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: every asset is built and nothing is published."
            exit 0
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases publish only from main; dispatch $GITHUB_REF with dry_run."
            exit 1
          fi
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=success" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | length')"
          if [[ "$passed" == "0" ]]; then
            echo "::error::CI has not passed on a push of $GITHUB_SHA, so it is not released."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.source.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - id: release_meta
        name: Resolve nightly version
        env:
          NIGHTLY_SHA: ${{ steps.source.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "$NIGHTLY_RUN_NUMBER" \
            --sha "$NIGHTLY_SHA" \
            --github-output

  # The platform-independent JS, built once for every package job (release.yml's build_bundle without the relay tracing config or npm launcher). Empty relay and Clerk values turn T3 Connect off.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # GITHUB_REPOSITORY points the bundle's CLI updates and the desktop feed at this repository.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      - name: Stage web asset manifest
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One release-desktop.yml call per host platform the fleet runs. Hosted runners have fewer cores than release.yml's, so each build gets twice its time limit.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      timeout_minutes: 60

  # No CLI archive: Node single executables do not run on x64 macOS (see release.yml). An Intel runner packages it natively: under Rosetta on a hosted arm64 runner, generating the server compile cache outlasts its limit.
  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: macos-26-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      timeout_minutes: 60

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true
      timeout_minutes: 60

  # node-pty compiles from source, so arm64 builds on arm64 hardware.
  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true
      timeout_minutes: 60

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_mac_arm64, desktop_mac_x64, desktop_linux_x64, desktop_linux_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Merge desktop updater manifests
        run: node scripts/merge-release-update-manifests.ts release-assets --platform mac

      # electron-builder's config dump is not a release asset.
      - name: Check release assets
        run: |
          set -euo pipefail
          rm -f release-assets/builder-debug.yml
          version="${{ needs.preflight.outputs.version }}"
          for asset in \
            "t3-$version-darwin-arm64.tar.gz" \
            "t3-$version-linux-x64.tar.gz" \
            "t3-$version-linux-arm64.tar.gz" \
            nightly-mac.yml nightly-linux.yml nightly-linux-arm64.yml; do
            [[ -f "release-assets/$asset" ]] || { echo "::error::Missing release asset $asset."; exit 1; }
          done

      # The installer attached to a release defaults to this repository and the nightly channel.
      - name: Attach the installer
        run: |
          python3 - "$GITHUB_REPOSITORY" <<'EOF'
          import sys
          source = open("scripts/install.sh").read()
          replacements = {
              'repo="${T3CODE_RELEASE_REPOSITORY:-pingdotgg/t3code}"\n':
                  'repo="${T3CODE_RELEASE_REPOSITORY:-' + sys.argv[1] + '}"\n',
              'channel="${T3CODE_CHANNEL:-stable}"\n': 'channel="${T3CODE_CHANNEL:-nightly}"\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  sys.exit(f"scripts/install.sh no longer has exactly one {old.strip()}")
              source = source.replace(old, new)
          open("release-assets/install.sh", "w").write(source)
          EOF
          sh -n release-assets/install.sh

      # Written last, from the bytes that get uploaded, over every asset, so hosts can verify the desktop zips the way install.sh and `t3 update` verify CLI archives.
      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          {
            echo "### ${{ needs.preflight.outputs.release_name }}"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A draft until every asset is attached: connected clients update from a release as soon as it is public.
      - name: Publish release
        if: needs.preflight.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          draft: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish prerelease
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # The `update-feed` release's nightly.json is the pointer the patched desktop updater prefers over releases.atom (release.yml's update_feed). See docs/operations/03_release.md#update-feed.
  update_feed:
    name: Point the update feed at the newest nightly
    needs: [preflight, release]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - id: feed
        name: Read the update feed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          retries: 3
          script: |
            const { readNightlyUpdateFeed } = require('./.github/scripts/check-nightly-release.cjs');
            const { tag, pointerTag, feedNightly, feedTags } = await readNightlyUpdateFeed({ github, context });
            if (!tag) return;
            core.info(`Newest nightly: ${tag}. Pointer: ${pointerTag}. Feed: ${feedTags?.join(', ')}.`);
            core.setOutput('tag', tag);
            core.setOutput('pointer_stale', pointerTag !== tag);
            core.setOutput('feed', feedTags === undefined ? 'unreadable' : feedNightly === tag ? 'ok' : 'hidden');

      - name: Point the update feed at the newest nightly
        if: steps.feed.outputs.pointer_stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "The desktop updater reads this release to find the newest nightly. Do not delete it. See docs/operations/03_release.md."
          gh release upload update-feed nightly.json --clobber

      - name: Keep the update feed release public and never latest
        if: steps.feed.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit update-feed --draft=false --prerelease --latest=false

      # Upstream fails here; in this fork upstream's tags can crowd releases.atom, and every fork build reads the pointer above first.
      - name: Warn when the feed hides the newest nightly
        if: steps.feed.outputs.tag != '' && steps.feed.outputs.feed == 'hidden'
        env:
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
        run: echo "::warning::The first nightly in releases.atom is not $RELEASE_TAG. Tags without a release in this repository (such as upstream's) are the usual cause."
