name: ExaCode Release

# Fork-only nightly release for Mearman/t3code on GitHub-hosted runners. release.yml stays as
# upstream's and skips outside pingdotgg/t3code. See docs/operations/03_release.md#fork-releases.
# A publish needs the self-signed macOS certificate in CSC_LINK and CSC_KEY_PASSWORD, so every
# macOS release keeps the signature installed apps accept; only runs from main receive it.

on:
  # Ships only commits whose CI passed on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every asset but publish nothing. Required off main."
        required: false
        default: false
        type: boolean

# Publishers are never cancelled; queue: max keeps every pending run so no CI success is dropped.
concurrency:
  group: exacode-release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  preflight:
    name: Preflight
    # A workflow_run from a pull request, even one whose fork branch is named main, never releases.
    if: >-
      github.repository != 'pingdotgg/t3code' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Reads the CI runs of a manually released commit.
      actions: read
      contents: read
    outputs:
      build: ${{ steps.source.outputs.build }}
      ref: ${{ steps.source.outputs.ref }}
      publish: ${{ steps.source.outputs.publish }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
    steps:
      # Only main's tip is released: a CI run that finishes late, or a re-run of an older
      # commit's CI, never ships older code as the newest release.
      - id: source
        name: Resolve release source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            printf 'ref=%s\npublish=false\nbuild=true\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: every asset is built and nothing is published."
            exit 0
          fi
          if [[ "$EVENT" == "workflow_run" ]]; then
            ref="$RUN_SHA"
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Releases publish only from main; dispatch $GITHUB_REF with dry_run."
              exit 1
            fi
            ref="$GITHUB_SHA"
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$ref&event=push&status=success" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | length')"
            if [[ "$passed" == "0" ]]; then
              echo "::error::CI has not passed on a push of $ref, so it is not released."
              exit 1
            fi
          fi
          printf 'ref=%s\npublish=true\n' "$ref" >> "$GITHUB_OUTPUT"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$tip" != "$ref" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on from $ref to $tip, whose CI releases it."
            exit 0
          fi
          released="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.target_commitish == \"$ref\")] | length")"
          if [[ "$released" != "0" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref is already released."
            exit 0
          fi
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD must hold the macOS signing certificate to publish."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.source.outputs.build == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.source.outputs.ref }}
          # The version counts main's commits: every commit, no file history.
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Drop checkout credentials
        if: steps.source.outputs.build == 'true'
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup dependencies
        if: steps.source.outputs.build == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      # Above every published nightly, even after main is rewritten: the build number is the
      # commit's first-parent depth on main or one more than that day's newest published build.
      - id: release_meta
        name: Resolve nightly version
        if: steps.source.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SHA: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' > "$RUNNER_TEMP/published-tags"
          node scripts/resolve-fork-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --sha "$NIGHTLY_SHA" \
            --published-tags "$RUNNER_TEMP/published-tags" \
            --github-output

  # The platform-independent JS, built once for every package job: release.yml's build_bundle
  # without the relay tracing config or npm launcher. Empty relay and Clerk values turn off
  # T3 Connect.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # GITHUB_REPOSITORY points the bundle's CLI updates and the desktop feed at this repository.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle

      # The bundles must update from this repository (scripts/lib/release-repository.ts).
      - name: Check the bundles' release repository
        run: |
          set -euo pipefail
          for dir in apps/server/dist apps/desktop/dist-electron; do
            if ! grep -rqE "\"$GITHUB_REPOSITORY\"|github\.com/$GITHUB_REPOSITORY/releases" "$dir"; then
              echo "::error::$dir does not update from $GITHUB_REPOSITORY."
              exit 1
            fi
          done

      - name: Stage web asset manifest
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # One release-desktop.yml call per host platform the fleet runs. Hosted runners have fewer
  # cores than release.yml's, so each build gets twice its time limit. The signing certificate
  # goes only to runs from main, so a dry run of another branch's code is signed ad hoc.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.CSC_KEY_PASSWORD || '' }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      timeout_minutes: 60

  # No CLI archive: Node single executables do not run on x64 macOS (see release.yml). Built on
  # Intel: under Rosetta on a hosted arm64 runner, the server compile cache outlasts its limit.
  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.CSC_KEY_PASSWORD || '' }}
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS x64
      runner: macos-26-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      timeout_minutes: 60

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true
      timeout_minutes: 60

  # node-pty compiles from source, so arm64 builds on arm64 hardware.
  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [preflight, build_bundle]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true
      timeout_minutes: 60

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_mac_arm64, desktop_mac_x64, desktop_linux_x64, desktop_linux_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Drop checkout credentials
        uses: ./.github/actions/drop-checkout-credentials

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Merge desktop updater manifests
        run: node scripts/merge-release-update-manifests.ts release-assets --platform mac

      # electron-builder's config dump is not a release asset.
      - name: Check release assets
        run: |
          set -euo pipefail
          rm -f release-assets/builder-debug.yml
          version="${{ needs.preflight.outputs.version }}"
          for asset in \
            "t3-$version-darwin-arm64.tar.gz" \
            "t3-$version-linux-x64.tar.gz" \
            "t3-$version-linux-arm64.tar.gz" \
            nightly-mac.yml nightly-linux.yml nightly-linux-arm64.yml; do
            [[ -f "release-assets/$asset" ]] || { echo "::error::Missing release asset $asset."; exit 1; }
          done

      # The installer attached to a release defaults to this repository and the nightly channel.
      - name: Attach the installer
        run: |
          python3 - "$GITHUB_REPOSITORY" <<'EOF'
          import sys
          source = open("scripts/install.sh").read()
          replacements = {
              'repo="${T3CODE_RELEASE_REPOSITORY:-pingdotgg/t3code}"\n':
                  'repo="${T3CODE_RELEASE_REPOSITORY:-' + sys.argv[1] + '}"\n',
              'channel="${T3CODE_CHANNEL:-stable}"\n': 'channel="${T3CODE_CHANNEL:-nightly}"\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  sys.exit(f"scripts/install.sh no longer has exactly one {old.strip()}")
              source = source.replace(old, new)
          open("release-assets/install.sh", "w").write(source)
          EOF
          sh -n release-assets/install.sh

      # Written last, over every uploaded asset, so hosts can verify the desktop zips the way
      # install.sh and `t3 update` verify CLI archives.
      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          {
            echo "### ${{ needs.preflight.outputs.release_name }}"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Preflight's check again, since main can move while the builds run; the newer commit's
      # run then releases instead.
      - id: tip
        name: Confirm the release commit is still main's tip
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$tip" == "$RELEASE_REF" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on from $RELEASE_REF to $tip, whose CI releases it."
          fi

      # A published release is never edited: the action would keep it published and replace its
      # assets in place. A draft left by an earlier attempt of this run is reused.
      - name: Refuse an existing release of this version
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length")"
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and (.draft | not)) | .id")"
          if [[ "$tags" != "0" || -n "$published" ]]; then
            echo "::error::$RELEASE_TAG is already tagged or published; a release is never replaced."
            exit 1
          fi

      # A draft until every asset is attached: clients update from a release once it is public.
      - name: Publish release
        if: steps.tip.outputs.current == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          draft: true
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish prerelease
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # The `update-feed` release's nightly.json is the pointer fork clients read instead of
  # releases.atom, which lists upstream's tags too (docs/operations/03_release.md#fork-releases).
  # Every publishing run, including one that released nothing, points it at the newest published
  # nightly, so a re-run repairs a pointer an earlier run left behind. It never moves back.
  update_feed:
    name: Point the update feed at the newest nightly
    needs: [preflight, release]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.publish == 'true' &&
      contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Point the update feed at the newest nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          newest="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and (.tag_name | test("^v[0-9]+[.][0-9]+[.][0-9]+-nightly[.]"))) | .tag_name' \
            | sort -V | tail -n 1)"
          if [[ -z "$newest" ]]; then
            echo "::notice::No nightly is published yet."
            exit 0
          fi
          if gh release view update-feed > /dev/null; then
            assets="$(gh release view update-feed --json assets --jq '.assets[].name')"
            current=""
            if grep -qx nightly.json <<< "$assets"; then
              gh release download update-feed --pattern nightly.json --output pointer.json
              current="$(jq -er '.tag_name' pointer.json)"
            fi
          else
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "The desktop updater reads this release to find the newest nightly. Do not delete it. See docs/operations/03_release.md."
            current=""
          fi
          if [[ "$current" == "$newest" ]]; then
            echo "::notice::The update feed already points at $newest."
          elif [[ -n "$current" && "$(printf '%s\n' "$current" "$newest" | sort -V | tail -n 1)" != "$newest" ]]; then
            echo "::error::The update feed points at $current, newer than every published nightly ($newest)."
            exit 1
          else
            gh api "repos/$GH_REPO/releases/tags/$newest" --jq '{tag_name, name, body}' > nightly.json
            gh release upload update-feed nightly.json --clobber
            echo "Pointed the update feed at $newest (was ${current:-unset})."
          fi
          gh release edit update-feed --draft=false --prerelease --latest=false
